<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>body{margin:0}[hidden]{display:none!important}</style></head><body>
<title>Maquette Boomerang Terrain</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout : à gauche le panneau du testeur, au centre un téléphone. Sur un vrai téléphone, l'appli prend tout l'écran. */
:root{
  --ink:#1d2340;          /* encre de la marque : bleu nuit */
  --bg:#eef0f6;           /* fond autour du téléphone */
  --screen:#ffffff;       /* fond de l'appli */
  --soft:#f3f4f9;         /* cartes et boutons calmes */
  --line:#d9dcea;
  --muted:#5b6283;
  --ok:#14a35a;  --ok-bg:#e3f6ec;
  --todo:#f08a00; --todo-bg:#fff1dc;
  --bad:#e0352b; --bad-bg:#fde6e4;
  --off:#9aa0b8;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ink:#e8eaff;--bg:#0e1020;--screen:#171a2e;--soft:#22263f;--line:#30355a;--muted:#a3a9cc;
  --ok:#3fcf86;--ok-bg:#163527;--todo:#ffa53a;--todo-bg:#3a2a12;--bad:#ff6a5f;--bad-bg:#3d1916;--off:#5f6588;color-scheme:dark}}
:root[data-theme="dark"]{
  --ink:#e8eaff;--bg:#0e1020;--screen:#171a2e;--soft:#22263f;--line:#30355a;--muted:#a3a9cc;
  --ok:#3fcf86;--ok-bg:#163527;--todo:#ffa53a;--todo-bg:#3a2a12;--bad:#ff6a5f;--bad-bg:#3d1916;--off:#5f6588;color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--todo);outline-offset:2px}

.wrap{display:flex;gap:32px;justify-content:center;align-items:flex-start;padding-block:24px;min-height:100%}
.panel{width:280px;display:flex;flex-direction:column;gap:14px;font-size:14px;color:var(--muted)}
.panel h1{font-family:var(--display);font-size:26px;line-height:1.1;color:var(--ink);margin:0;text-wrap:balance}
.panel p{margin:0;line-height:1.45}
.panel .grp{display:flex;flex-direction:column;gap:6px}
.panel .lbl{font-size:12px;text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.seg{display:flex;background:var(--screen);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;padding:8px 6px;border-radius:8px;font-weight:700;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--screen)}
.plain{padding:9px 12px;border-radius:9px;border:1px solid var(--line);background:var(--screen);font-size:14px;font-weight:700;text-align:left}

.phone{width:390px;max-width:100%;height:800px;max-height:calc(100vh - 48px);min-height:620px;background:var(--screen);
  border-radius:38px;border:10px solid #10132a;box-shadow:0 30px 60px -20px rgba(16,19,42,.45);
  display:flex;flex-direction:column;overflow:hidden;position:relative}

/* Sur téléphone : l'appli plein écran, le panneau devient une barre repliée */
@media (max-width:760px){
  body{padding-left:0;padding-right:0}
  .wrap{flex-direction:column;gap:0;padding-block:0}
  .panel{width:100%;padding:10px max(16px,env(safe-area-inset-left,0px)) 10px max(16px,env(safe-area-inset-right,0px));background:var(--soft)}
  .panel .more{display:none}
  .panel.open .more{display:flex}
  .panel h1{font-size:18px}
  .phone{width:100%;height:auto;min-height:calc(100vh - 60px);max-height:none;border:0;border-radius:0;box-shadow:none}
}
@media (min-width:761px){.toggle-panel{display:none}}

/* En-tête de l'appli */
.top{display:flex;align-items:center;gap:8px;padding:12px 12px 10px;border-bottom:1px solid var(--line);min-height:68px}
.iconbtn{width:52px;height:52px;border-radius:16px;background:var(--soft);display:grid;place-items:center;font-size:26px;flex:none}
.top .t{flex:1;min-width:0;font-family:var(--display);font-weight:800;font-size:21px;line-height:1.1;display:flex;align-items:center;gap:8px}
.top .t span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.listen{background:var(--ink);color:var(--screen)}
.listen.on{animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.sync{display:flex;align-items:center;gap:4px;padding:6px 10px;border-radius:999px;font-weight:700;font-size:15px;background:var(--ok-bg);color:var(--ok)}
.sync.wait{background:var(--todo-bg);color:var(--todo)}

.body{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.foot{padding:12px 16px 16px;border-top:1px solid var(--line);display:flex;gap:10px}

.big{width:100%;min-height:68px;border-radius:20px;font-family:var(--display);font-weight:800;font-size:23px;display:flex;align-items:center;justify-content:center;gap:10px;padding:8px 14px}
.big.go{background:var(--ok);color:#fff}
.big.warn{background:var(--todo);color:#fff}
.big.stop{background:var(--bad);color:#fff}
.big.calm{background:var(--soft)}
.big[disabled]{opacity:.4;cursor:default}

/* Mission */
.mission{border-radius:22px;overflow:hidden;border:1px solid var(--line)}
.place{height:130px;position:relative;background:
  linear-gradient(180deg,transparent 55%,rgba(0,0,0,.45)),
  repeating-linear-gradient(90deg,#c94b3c 0 26px,#f2efe6 26px 52px) top/100% 22px no-repeat,
  linear-gradient(#8fb7d6,#8fb7d6) 0 22px/100% 100% no-repeat;display:flex;align-items:flex-end;padding:10px 12px}
.place .shop{position:absolute;left:50%;top:34px;transform:translateX(-50%);font-size:54px}
.place b{color:#fff;font-family:var(--display);font-size:20px;position:relative;line-height:1.1}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px}
.fact{display:flex;gap:8px;align-items:center;background:var(--soft);border-radius:14px;padding:8px 10px;font-weight:700;min-width:0}
.fact i{font-style:normal;font-size:24px}
.fact span{min-width:0;overflow-wrap:anywhere;line-height:1.15}
.mission .row{display:flex;gap:8px;padding:0 12px 12px}
.mission .row button{flex:1;min-height:52px;border-radius:14px;background:var(--soft);font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{border-radius:20px;padding:14px 10px 12px;background:var(--soft);display:flex;flex-direction:column;align-items:center;gap:4px;
  border:3px solid transparent;position:relative;min-height:118px;justify-content:center;text-align:center}
.tile .em{font-size:40px;line-height:1}
.tile .nm{font-family:var(--display);font-weight:800;font-size:18px;line-height:1.1}
.tile .st{font-size:13px;font-weight:700}
.tile.done{border-color:var(--ok);background:var(--ok-bg)} .tile.done .st{color:var(--ok)}
.tile.todo{border-color:var(--todo);background:var(--todo-bg)} .tile.todo .st{color:var(--todo)}
.tile.bad{border-color:var(--bad);background:var(--bad-bg)} .tile.bad .st{color:var(--bad)}
.tile.off{opacity:.45}
.dot{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:16px}
.done .dot{background:var(--ok)} .todo .dot{background:var(--todo)} .bad .dot{background:var(--bad)}

/* Clavier */
.display{font-family:var(--display);font-weight:800;font-size:34px;text-align:center;letter-spacing:.04em;min-height:52px;font-variant-numeric:tabular-nums}
.pins{display:flex;justify-content:center;gap:16px;min-height:52px;align-items:center}
.pins i{width:26px;height:26px;border-radius:50%;border:3px solid var(--ink)}
.pins i.f{background:var(--ink)}
.pins.err i{border-color:var(--bad);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.keys button{height:64px;border-radius:18px;background:var(--soft);font-family:var(--display);font-weight:800;font-size:30px}
.keys .ok{background:var(--ok);color:#fff}
.hello{text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
.hello .em{font-size:52px}
.hello b{font-family:var(--display);font-size:24px;line-height:1.15;text-wrap:balance}
.hello small{color:var(--muted);font-size:15px}

/* Caméra simulée */
.cam{border-radius:24px;background:#0d0f1c;aspect-ratio:3/4;max-width:100%;position:relative;display:grid;place-items:center;overflow:hidden}
.cam .oval{width:62%;aspect-ratio:3/4;border:4px dashed rgba(255,255,255,.7);border-radius:50%;display:grid;place-items:center;font-size:90px}
.cam .shot{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);width:84px;height:84px;border-radius:50%;background:#fff;border:7px solid rgba(255,255,255,.4);background-clip:padding-box}
.cam .flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.cam .flash.go{animation:flash .35s}
@keyframes flash{0%{opacity:.9}100%{opacity:0}}
.gps{display:flex;align-items:center;gap:10px;border-radius:16px;padding:12px;font-weight:700;background:var(--ok-bg);color:var(--ok)}
.gps i{font-style:normal;font-size:28px}

.donebox{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding-top:16px}
.check{width:130px;height:130px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;font-size:76px;animation:pop .35s}
@keyframes pop{0%{transform:scale(.4)}80%{transform:scale(1.08)}}
.donebox b{font-family:var(--display);font-size:30px;line-height:1.1}
.ticks{font-weight:700;display:flex;align-items:center;gap:6px;color:var(--muted)}
.ticks .tk{font-size:20px;letter-spacing:-6px;padding-right:6px}
.ticks .tk.r{color:#2f9be0}

/* Compteurs */
.counter{display:grid;grid-template-columns:52px 1fr;gap:10px;align-items:center;background:var(--soft);border-radius:20px;padding:12px}
.counter .em{font-size:40px;text-align:center}
.counter .nm{font-weight:700;font-size:15px;color:var(--muted);line-height:1.2}
.counter .ctl{grid-column:1/-1;display:grid;grid-template-columns:72px 1fr 72px;gap:10px;align-items:center}
.counter .ctl button{height:64px;border-radius:18px;font-size:38px;font-weight:800;font-family:var(--display);line-height:1}
.counter .minus{background:var(--screen);border:2px solid var(--line)}
.counter .plus{background:var(--ink);color:var(--screen)}
.counter .n{text-align:center;font-family:var(--display);font-weight:800;font-size:44px;font-variant-numeric:tabular-nums;line-height:1}
.counter .goal{font-size:13px;font-weight:700;color:var(--muted)}

.photos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ph{aspect-ratio:1;border-radius:20px;border:3px dashed var(--todo);background:var(--todo-bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-weight:700;position:relative;overflow:hidden}
.ph .em{font-size:44px}
.ph.done{border:3px solid var(--ok);background:linear-gradient(135deg,#6a8f6e,#c9b07a)}
.ph.done .lab{position:absolute;bottom:0;left:0;right:0;background:var(--ok);color:#fff;padding:6px}

.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice{border-radius:20px;background:var(--bad-bg);border:3px solid transparent;padding:16px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:700;text-align:center;line-height:1.15}
.choice .em{font-size:44px}
.choice[aria-pressed="true"]{border-color:var(--bad)}

.mic{width:118px;height:118px;border-radius:50%;background:var(--ok);color:#fff;font-size:54px;display:grid;place-items:center;margin:0 auto;touch-action:none;user-select:none;-webkit-user-select:none}
.mic.rec{background:var(--bad);transform:scale(1.12)}
.hint{text-align:center;font-weight:700;color:var(--muted)}
.bubble{display:flex;align-items:center;gap:10px;background:var(--ok-bg);border-radius:18px;padding:10px 14px;font-weight:700}
.bubble .wave{flex:1;height:22px;background:repeating-linear-gradient(90deg,var(--ok) 0 3px,transparent 3px 7px);mask:linear-gradient(90deg,#000 30%,rgba(0,0,0,.4));border-radius:4px}

.days{display:flex;flex-direction:column;gap:8px}
.day{display:flex;align-items:center;gap:12px;background:var(--soft);border-radius:16px;padding:10px 14px;font-weight:700}
.day .s{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:20px;flex:none}
.day .s.ok{background:var(--ok)} .day .s.todo{background:var(--todo)} .day .s.bad{background:var(--bad)}
.day .d{flex:1}
.day .m{font-variant-numeric:tabular-nums}
.total{border-radius:22px;background:var(--ink);color:var(--screen);padding:16px;display:flex;flex-direction:column;gap:2px;text-align:center}
.total b{font-family:var(--display);font-size:38px;line-height:1.1;font-variant-numeric:tabular-nums}
.total small{opacity:.8}
.note{font-size:13px;color:var(--muted);text-align:center}

/* Superviseur */
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.sum{border-radius:16px;padding:8px 4px;text-align:center;font-weight:700;font-size:12px;line-height:1.15}
.sum b{display:block;font-family:var(--display);font-size:30px;line-height:1.1}
.sum.ok{background:var(--ok-bg);color:var(--ok)} .sum.todo{background:var(--todo-bg);color:var(--todo)}
.sum.bad{background:var(--bad-bg);color:var(--bad)} .sum.off{background:var(--soft);color:var(--muted)}
.agent{display:flex;align-items:center;gap:12px;background:var(--soft);border-radius:18px;padding:10px 12px;text-align:left;width:100%;border-left:8px solid var(--off)}
.agent.ok{border-left-color:var(--ok)} .agent.todo{border-left-color:var(--todo)} .agent.bad{border-left-color:var(--bad)}
.av{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-family:var(--display);font-size:18px;color:#fff;flex:none;background:var(--muted)}
.agent .who{flex:1;min-width:0}
.agent .who b{display:block;font-size:17px}
.agent .who small{color:var(--muted);font-weight:700}
.agent .em{font-size:28px}
.map{border-radius:22px;overflow:hidden;border:1px solid var(--line)}
.map svg{display:block;width:100%;height:auto}
.alert{display:flex;gap:12px;align-items:center;border-radius:18px;padding:12px;font-weight:700;width:100%;text-align:left}
.alert.bad{background:var(--bad-bg)} .alert.todo{background:var(--todo-bg)}
.alert .em{font-size:34px}
.alert small{display:block;color:var(--muted)}
.checkrow{display:flex;align-items:center;gap:10px;background:var(--soft);border-radius:18px;padding:10px 12px}
.checkrow .em{font-size:34px}
.checkrow .nm{flex:1;font-weight:700;line-height:1.2}
.yn{display:flex;gap:6px}
.yn button{width:54px;height:54px;border-radius:14px;font-size:26px;background:var(--screen);border:2px solid var(--line)}
.yn button.y[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.yn button.n[aria-pressed="true"]{background:var(--bad);border-color:var(--bad);color:#fff}
.stars{display:flex;justify-content:center;gap:6px}
.stars button{font-size:44px;filter:grayscale(1);opacity:.4}
.stars button.on{filter:none;opacity:1}
.selfie{display:flex;gap:12px;align-items:center}
.selfie .face{width:96px;height:120px;border-radius:18px;background:linear-gradient(160deg,#b9805a,#5d3a26);display:grid;place-items:center;font-size:54px;flex:none}
.kv{display:flex;flex-direction:column;gap:6px;font-weight:700}
.kv span{display:flex;gap:6px;align-items:center}

.toast{position:absolute;left:12px;right:12px;bottom:90px;background:var(--ink);color:var(--screen);border-radius:16px;padding:12px 14px;font-weight:700;text-align:center;opacity:0;transform:translateY(10px);transition:.25s;pointer-events:none}
.toast.show{opacity:1;transform:none}
.offline-band{background:var(--todo);color:#fff;text-align:center;font-weight:700;padding:4px;font-size:14px}

.phrases{max-height:340px;overflow:auto;background:var(--screen);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px}
.phrases div{font-size:13px;line-height:1.35;color:var(--ink)}
.phrases div b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="wrap">
  <aside class="panel" id="panel">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
      <h1>Maquette Boomerang Terrain</h1>
      <button class="plain toggle-panel" id="togglePanel" aria-expanded="false">Réglages</button>
    </div>
    <div class="more grp" style="gap:14px">
      <p>Tout est faux et rien n'est envoyé : c'est pour tester les écrans avec les hôtesses avant de coder.</p>
      <div class="grp"><span class="lbl">Qui teste ?</span>
        <div class="seg" id="roleSeg"><button data-role="hotesse" aria-pressed="true">Hôtesse</button><button data-role="sup" aria-pressed="false">Superviseur</button></div></div>
      <div class="grp"><span class="lbl">Réseau</span>
        <div class="seg" id="netSeg"><button data-net="1" aria-pressed="true">Réseau OK</button><button data-net="0" aria-pressed="false">Pas de réseau</button></div></div>
      <div class="grp"><span class="lbl">Langue du bouton écouter</span>
        <div class="seg" id="langSeg"><button data-lang="fr" aria-pressed="true">Français</button><button data-lang="wo" aria-pressed="false">Wolof</button></div></div>
      <button class="plain" id="reset">↺ Recommencer depuis la connexion</button>
      <button class="plain" id="showPhrases">🎙 Voir les phrases à enregistrer</button>
      <div class="phrases" id="phrases" hidden></div>
      <p>Code d'essai donné par le bureau : <b>1234</b>. N'importe quel numéro marche.</p>
    </div>
  </aside>
  <main class="phone" id="phone" aria-live="polite"></main>
</div>

<script>
// ---------- Données d'exemple (fictives) ----------
const MISSION={lieu:"Supermarché Sacré-Cœur 3",heure:"9 h – 17 h",tenue:"T-shirt rouge",produit:"Jus de bissap",sup:"Fatou",tel:"77 000 00 00",campagne:"Dégustation bissap"};
const INDICS=[
  {k:"abordees",em:"🙋🏾‍♀️",nm:"Personnes abordées",goal:150},
  {k:"echantillons",em:"🥤",nm:"Échantillons donnés",goal:120},
  {k:"ventes",em:"🛒",nm:"Bouteilles vendues",goal:30}];
const PHOTOS=[{k:"stand",em:"⛺",nm:"Le stand"},{k:"rayon",em:"🗄️",nm:"Le rayon"},{k:"produit",em:"🧃",nm:"Le produit"},{k:"tenue",em:"👕",nm:"Ma tenue"}];
const PROBS=[{k:"rupture",em:"📦",nm:"Plus de produit"},{k:"resp",em:"🚫",nm:"Responsable absent"},{k:"casse",em:"🔧",nm:"Matériel cassé"},{k:"autre",em:"❓",nm:"Autre problème"}];
const TEAM=[
  {n:"Aïssatou Diop",lieu:"Sacré-Cœur 3",s:"ok",h:"8 h 52",c:"#7b4bd6"},
  {n:"Mariama Sow",lieu:"Point E",s:"ok",h:"8 h 58",c:"#d6604b"},
  {n:"Ndèye Fall",lieu:"Liberté 6",s:"todo",h:"en retard 25 min",c:"#2f8fd0"},
  {n:"Khady Ba",lieu:"Mermoz",s:"ok",h:"9 h 01",c:"#c28a12"},
  {n:"Awa Sène",lieu:"Ouakam",s:"bad",h:"absente",c:"#1f9a6a"},
  {n:"Coumba Ndiaye",lieu:"Almadies",s:"ok",h:"8 h 47",c:"#b0457f"},
  {n:"Bineta Faye",lieu:"Yoff",s:"todo",h:"en retard 10 min",c:"#5466c9"},
  {n:"Rokhaya Gueye",lieu:"Grand Yoff",s:"off",h:"commence à 11 h",c:"#7a7f99"}];
const FREE=[{n:"Seynabou Kane",d:"2 km"},{n:"Fatimata Sy",d:"4 km"},{n:"Dieynaba Mbaye",d:"6 km"}];
const PAIE=10000; // exemple de tarif journalier

// ---------- État ----------
let S;
function fresh(){return{role:S?S.role:"hotesse",online:S?S.online:true,lang:S?S.lang:"fr",
  screen:"login",step:"tel",tel:"",pin:"",newPin:"",first:true,consent:false,
  arrive:null,depart:null,count:{abordees:0,echantillons:0,ventes:0},rapportSent:false,
  photos:{},stock:{recu:120,restant:120},stockSent:false,prob:null,voice:0,probs:0,
  queue:[],team:TEAM.map(t=>({...t,valid:false})),sel:0,visit:{},stars:0,visitDone:false,dayDone:false,camFor:null,last:null}}

const $=s=>document.querySelector(s);
const now=()=>{const d=new Date();return d.getHours()+" h "+String(d.getMinutes()).padStart(2,"0")};

// ---------- File d'envoi (hors connexion) ----------
function enqueue(label){S.queue.push({label,sent:false,at:now()});flush();}
function pending(){return S.queue.filter(q=>!q.sent).length}
function flush(){if(!S.online)return;setTimeout(()=>{if(!S.online)return;let ch=false;S.queue.forEach(q=>{if(!q.sent){q.sent=true;ch=true}});if(ch)render()},1200)}
function ticks(sent){return sent?`<span class="ticks"><span class="tk r">✓✓</span> Reçu au bureau</span>`:`<span class="ticks"><span class="tk">✓</span> Gardé dans le téléphone, part dès qu'il y a du réseau</span>`}

// ---------- Voix ----------
let speaking=false;
function speak(txt){
  if(S.lang==="wo"){toast("🎙 Ici on entendra la vraie voix en wolof (à enregistrer)");return}
  try{const ss=window.speechSynthesis;if(!ss){toast("🔈 Ici on entendra la vraie voix en français");return}
    ss.cancel();const u=new SpeechSynthesisUtterance(txt);u.lang="fr-FR";u.rate=.92;
    u.onend=u.onerror=()=>{speaking=false;const b=$(".listen");b&&b.classList.remove("on")};
    speaking=true;const b=$(".listen");b&&b.classList.add("on");ss.speak(u)}catch(e){toast("🔈 Ici on entendra la vraie voix en français")}
}
let tt;function toast(m){const t=$("#toast");if(!t)return;t.textContent=m;t.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("show"),2600)}

};
function lockScreen(){return{t:"Pas encore",em:"🔒",back:"home",say:"Pointe d'abord ton arrivée.",
  body:`<div class="donebox"><span style="font-size:90px">🤳🏾</span><b>Pointe d'abord ton arrivée</b></div>`,foot:`<button class="big warn" data-go="pointer:arrive">🤳🏾 Pointer mon arrivée</button>`}}

// ---------- Petits outils ----------
function keypad(okOn,noOk){return`<div class="keys">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-go="key:${n}">${n}</button>`).join("")}
  <button data-go="key:del" aria-label="Effacer">⌫</button><button data-go="key:0">0</button>${noOk?"<span></span>":`<button class="ok" data-go="key:ok" ${okOn?"":"disabled"} aria-label="Valider">✓</button>`}</div>`}
function fmtTel(t){return t.replace(/^(\d{2})(\d{0,3})(\d{0,2})(\d{0,2}).*/,(m,a,b,c,d)=>[a,b,c,d].filter(Boolean).join(" "))||t}
function fmtF(n){return n.toLocaleString("fr-FR").replace(/ | /g," ")+" F"}
function ini(n){return n.split(" ").map(w=>w[0]).join("").slice(0,2)}
function col(s){return{ok:"var(--ok)",todo:"var(--todo)",bad:"var(--bad)",off:"var(--off)"}[s]}
function fakeMap(pins,me){return`<svg viewBox="0 0 360 280" role="img" aria-label="Carte">
  <rect width="360" height="280" fill="var(--soft)"/>
  <path d="M0 200 Q120 170 200 210 T360 190 L360 280 L0 280Z" fill="#8fc3e8" opacity=".55"/>
  <g stroke="var(--line)" stroke-width="10" fill="none" stroke-linecap="round"><path d="M20 40 L340 70"/><path d="M60 0 L110 280"/><path d="M230 0 L250 200"/><path d="M0 130 L360 150"/></g>
  ${pins.map(p=>`<g transform="translate(${p.x} ${p.y})"><circle r="${p.big?16:11}" fill="${p.c}" stroke="#fff" stroke-width="3"/></g>`).join("")}
  ${me?`<g transform="translate(${me.x} ${me.y})"><circle r="20" fill="#2f9be0" opacity=".25"/><circle r="9" fill="#2f9be0" stroke="#fff" stroke-width="3"/></g>`:""}</svg>`}

// ---------- Rendu ----------
function render(){
  const [name,arg]=S.screen.split(":");S.arg=arg;
  const sc=SCREENS[name]();S.say=sc.say;
  const p=pending();
  $("#phone").innerHTML=`${S.online?"":`<div class="offline-band">📵 Pas de réseau : tout est gardé dans le téléphone</div>`}
    <header class="top">
      ${sc.back?`<button class="iconbtn" data-go="${sc.back}" aria-label="Retour">⬅</button>`:""}
      <div class="t"><span aria-hidden="true">${sc.em}</span><span>${sc.t}</span></div>
      ${S.screen.startsWith("login")||S.screen==="consent"?"":`<span class="sync ${p?"wait":""}" title="${p?p+" à envoyer":"Tout est envoyé"}">${p?"☁️ "+p:"☁️ ✓"}</span>`}
      <button class="iconbtn listen" data-go="listen" aria-label="Écouter">🔊</button>
    </header>
    <section class="body">${sc.body}</section>
    ${sc.foot?`<footer class="foot">${sc.foot}</footer>`:""}
    <div class="toast" id="toast"></div>`;
  bindMic();
}
function go(s){S.screen=s;S.fix=false;try{speechSynthesis.cancel()}catch(e){};render();$(".body")&&($(".body").scrollTop=0)}

// ---------- Actions ----------
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-go]");if(!b||b.disabled||!$("#phone").contains(b))return;
  const [a,x,y]=b.dataset.go.split(":");
  switch(a){
    case"listen":return speak(S.say);
    case"login":S.step=x||"tel";S.pin="";S.newPin="";return go("login");
    case"key":return key(x);
    case"consentOk":S.consent=true;return go("home");
    case"pointer":return go("pointer:"+x);
    case"shoot":flashThen(()=>{S[x]=now();enqueue(x==="arrive"?"Arrivée":"Départ");if(x==="arrive")S.team[0].s="ok";go("pointer:"+x)});return;
    case"cnt":S.count[x]=Math.max(0,S.count[x]+ +y);if(navigator.vibrate)try{navigator.vibrate(15)}catch(e){};return render();
    case"sendRapport":S.rapportSent=true;S.queue=S.queue.filter(q=>q.label!=="Rapport"||q.sent);enqueue("Rapport");toast("✓ Rapport gardé, il part tout seul");return render();
    case"cam":S.camFor=x;return go("cam");
    case"snap":flashThen(()=>{S.photos[S.camFor]=true;enqueue("Photo "+S.camFor);go("photos")});return;
    case"stk":S.stock[x]=Math.max(0,S.stock[x]+ +y);if(S.stock.restant>S.stock.recu)S.stock.restant=S.stock.recu;return render();
    case"sendStock":S.stockSent=true;enqueue("Stock");return render();
    case"probleme":S.prob=null;S.voice=0;S.probPhoto=false;return go("probleme");
    case"prob":S.prob=x;return go("probleme");
    case"probPhoto":S.probPhoto=true;return render();
    case"delVoice":S.voice=0;return render();
    case"playVoice":return toast("▶ Lecture du message vocal");
    case"sendProb":S.probs++;enqueue("Problème");S.prob=null;S.voice=0;S.probPhoto=false;return go("probSent");
    case"view":S.view=x;return render();
    case"agent":S.sel=+x;return go("agent");
    case"fix":S.fix=true;return render();
    case"validate":S.team[S.sel].valid=true;S.team[S.sel].fixed=x==="fix";enqueue("Validation");S.fix=false;return render();
    case"replace":{const f=FREE[+x],t=S.team[S.sel];S.repl=f.n;t.n=f.n;t.s="todo";t.h="en route";t.c="#555c80";enqueue("Remplacement");return go("replaced")}
    case"vis":S.visit[x]=+y;return render();
    case"star":S.stars=+x;return render();
    case"sendVisit":S.visitDone=true;enqueue("Visite");return render();
    case"sendDay":S.dayDone=true;enqueue("Journée");return render();
    default:return go(b.dataset.go);
  }
});
function flashThen(fn){const f=$("#flash");if(f){f.classList.remove("go");void f.offsetWidth;f.classList.add("go")}setTimeout(fn,350)}
function key(k){
  if(S.step==="tel"){if(k==="del")S.tel=S.tel.slice(0,-1);else if(k==="ok"){S.step="code";S.pin=""}else if(S.tel.length<9)S.tel+=k;return render()}
  const field=S.step==="new"?"newPin":"pin";
  if(k==="del"){S[field]=S[field].slice(0,-1);return render()}
  if(S[field].length>=4)return;S[field]+=k;render();
  if(S[field].length<4)return;
  setTimeout(()=>{
    if(S.step==="code"){
      if(S.first&&S.pin!=="1234")return wrong("Ce n'est pas le bon code");
      if(S.first){S.step="new";S.newPin="";return render()}
      if(S.pin!==S.myPin)return wrong("Ce n'est pas le bon code");
      return enter();
    }
    if(S.step==="new"){S.step="again";S.pin="";return render()}
    if(S.step==="again"){if(S.pin!==S.newPin){S.step="new";S.newPin="";S.pin="";render();return toast("Les deux codes sont différents. Recommence.")}
      S.myPin=S.newPin;S.first=false;toast("✓ Ton code est enregistré");return enter()}
  },250);
}
function wrong(m){S.pin="";render();const p=$("#pins");p&&p.classList.add("err");toast("✕ "+m)}
function enter(){S.pin="";if(S.role==="sup")return go("sup");go(S.consent?"home":"consent")}

// Micro : garder appuyé, comme WhatsApp
let recT,recStart;
function bindMic(){const m=$("#mic");if(!m)return;
  const start=e=>{e.preventDefault();m.classList.add("rec");recStart=Date.now();$("#micHint").textContent="🔴 0:00 — lâche pour arrêter";
    recT=setInterval(()=>{const s=Math.floor((Date.now()-recStart)/1000);$("#micHint").textContent="🔴 0:"+String(s).padStart(2,"0")+" — lâche pour arrêter"},250)};
  const stop=()=>{if(!recStart)return;clearInterval(recT);const s=Math.max(1,Math.round((Date.now()-recStart)/1000));recStart=null;S.voice=Math.min(59,s);render()};
  m.addEventListener("pointerdown",start);m.addEventListener("pointerup",stop);m.addEventListener("pointerleave",stop);m.addEventListener("pointercancel",stop);
  m.addEventListener("contextmenu",e=>e.preventDefault());}

// ---------- Panneau du testeur ----------
function seg(id,attr,fn){$(id).addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
  $(id).querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b));fn(b.dataset[attr])})}
seg("#roleSeg","role",r=>{S.role=r;S=fresh();S.role=r;if(r==="sup"){S.first=false;S.myPin="1234"}render()});
seg("#netSeg","net",v=>{S.online=v==="1";if(S.online)flush();render()});
seg("#langSeg","lang",v=>{S.lang=v});
$("#reset").onclick=()=>{const r=S.role;S=fresh();S.role=r;if(r==="sup"){S.first=false;S.myPin="1234"}render()};
$("#togglePanel").onclick=()=>{const p=$("#panel");p.classList.toggle("open");$("#togglePanel").setAttribute("aria-expanded",p.classList.contains("open"))};
$("#showPhrases").onclick=()=>{const box=$("#phrases");if(!box.hidden){box.hidden=true;return}
  const keep=JSON.parse(JSON.stringify(S));const list=[];
  const tryS=(lab,setup)=>{S=JSON.parse(JSON.stringify(keep));setup();const [n,a]=S.screen.split(":");S.arg=a;try{list.push([lab,SCREENS[n]().say])}catch(e){}};
  tryS("Connexion · numéro",()=>{S.screen="login";S.step="tel"});
  tryS("Connexion · code",()=>{S.screen="login";S.step="code"});
  tryS("Connexion · choisir son code",()=>{S.screen="login";S.step="new"});
  tryS("Connexion · vérifier le code",()=>{S.screen="login";S.step="again"});
  tryS("Accord selfie et GPS",()=>{S.screen="consent"});
  tryS("Ma journée",()=>{S.screen="home"});
  tryS("Pointage",()=>{S.screen="pointer:arrive";S.arrive=null});
  tryS("Rapport",()=>{S.screen="rapport";S.arrive="9 h"});
  tryS("Photos",()=>{S.screen="photos";S.arrive="9 h"});
  tryS("Stock",()=>{S.screen="stock";S.arrive="9 h"});
  tryS("Problème · choisir",()=>{S.screen="probleme";S.prob=null});
  tryS("Problème · photo et voix",()=>{S.screen="probleme";S.prob="rupture"});
  tryS("Problème envoyé",()=>{S.screen="probSent"});
  tryS("Mes jours",()=>{S.screen="jours"});
  tryS("Superviseur · équipe",()=>{S.screen="sup"});
  tryS("Superviseur · visite",()=>{S.screen="visite"});
  tryS("Superviseur · rapport du jour",()=>{S.screen="journee"});
  S=keep;
  box.innerHTML=list.map(([l,t])=>`<div><b>${l}</b>${t}</div>`).join("")+`<div><b>Note</b>Les chiffres et les noms changent selon la mission : on enregistre les nombres et les mots séparément, puis l'appli les assemble.</div>`;
  box.hidden=false};

render();
</script>
